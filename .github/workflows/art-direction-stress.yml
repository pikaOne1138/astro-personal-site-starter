name: Art Direction Stress QA
on:
  pull_request:
    paths:
      - 'src/pages/layouts/**'
      - 'src/data/art-direction-layout-content.json'
      - 'src/data/art-direction-content.ts'
      - 'scripts/qa-art-direction-interiors.mjs'
      - 'scripts/qa-art-direction-stress.mjs'
      - '.github/workflows/art-direction-stress.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stress-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Serve independent local preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/astro-preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4321/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/astro-preview.log
          exit 1
      - name: Stress no content, single entry, and long CJK with JS disabled
        run: node scripts/qa-art-direction-stress.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art-direction-stress-captures
          path: qa-artifacts/art-direction/interior-qa/
          retention-days: 14
