name: Template Gallery QA
on:
  pull_request:
    paths:
      - 'scripts/*template-gallery*'
      - 'src/data/layout-assembly/**'
      - 'src/pages/layouts/**'
      - 'src/pages/templates/**'
      - 'src/pages/starter/**'
      - 'public/template-gallery/**'
      - '.github/workflows/template-gallery-qa.yml'
permissions:
  checks: read
  actions: read
  contents: read
jobs:
  ci-change-classifier:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          # PR #67 predates this classifier; load its trusted main copy after merge.
          if git cat-file -e origin/main:scripts/ci-pr67-change-gate.mjs 2>/dev/null; then
            git show origin/main:scripts/ci-pr67-change-gate.mjs > /tmp/ci-pr67-change-gate.mjs
            node /tmp/ci-pr67-change-gate.mjs
          else
            node scripts/ci-pr67-change-gate.mjs
          fi
  gallery:
    needs: ci-change-classifier
    if: needs.ci-change-classifier.outputs.mode != 'ledger_only'
    env:
      GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-package-lock playwright sharp
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Capture missing thumbnails and validate all routes
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/preview.log 2>&1 &
          for n in $(seq 1 30); do curl -sf http://127.0.0.1:4321/layouts/ > /dev/null && break; sleep 1; done
          node scripts/capture-template-gallery.mjs
          node scripts/verify-template-gallery.mjs
          cp public/template-gallery/*.webp dist/template-gallery/
      - uses: actions/upload-artifact@v4
        with:
          name: template-gallery-captures
          path: |
            public/template-gallery/
            docs/template-gallery/captured.json
          retention-days: 14
      - name: Gallery browser QA
        run: node scripts/qa-template-gallery.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: template-gallery-evidence
          path: |
            public/template-gallery/
            docs/template-gallery/
          retention-days: 14
