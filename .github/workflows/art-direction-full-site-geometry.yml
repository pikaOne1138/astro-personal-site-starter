name: Art Direction Full-site Navigation Geometry
on:
  pull_request:
    paths:
      - 'src/pages/layouts/subject-atlas/**'
      - 'src/pages/layouts/practice-compass/**'
      - 'src/components/art-direction/PrototypeNav.astro'
      - 'scripts/qa-art-direction-full-site-geometry.mjs'
      - '.github/workflows/art-direction-full-site-geometry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-site-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Local static preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/astro-preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4321/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/astro-preview.log
          exit 1
      - run: node scripts/qa-art-direction-full-site-geometry.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art-direction-full-route-geometry
          path: qa-artifacts/art-direction/full-site-consistency/
          retention-days: 14
