name: Verify Cloudflare Static Assets

on:
  pull_request:
    paths:
      - 'astro.config.mjs'
      - 'package.json'
      - 'src/**'
      - '.ai/**'
      - 'docs/student-builder-pack/**'
      - 'docs/student-intake/**'
      - 'docs/quality/**'
      - 'scripts/**'
      - 'wrangler.jsonc'
      - '.github/workflows/verify-cloudflare-ssg.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  static-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate registered Blocks, Layouts and Pattern references
        id: registry
        run: node scripts/verify-registry-contract.mjs
      - name: Compile registered Blocks, Effects and Editorial recipes
        id: compile
        run: node scripts/verify-astro-components.mjs
      - name: Fault-inject missing asset QA declarations
        run: node scripts/test-quality-coverage-regressions.mjs
      - name: Enforce registered asset QA ownership and write quality dashboard
        id: coverage
        if: always()
        run: node scripts/verify-quality-coverage.mjs
      - name: Fault-inject invalid W N F historical regression entries
        run: node scripts/test-historic-regression-ledger.mjs
      - name: Verify historical W N F coverage ledger
        id: history
        if: always()
        run: node scripts/verify-historic-regressions.mjs
      - name: Upload machine-readable quality coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-asset-coverage
          path: qa-artifacts/quality/
          retention-days: 30
      - name: Validate learner navigation audit script syntax
        run: node --check scripts/verify-student-navigation.mjs
      - name: Build with Cloudflare Pages automatic URL and default root path
        id: buildsite
        env:
          CF_PAGES_URL: https://example.com
        run: npm run build
      - name: Extract student kit and build knowledge/helper independently
        id: studentkit
        env:
          FULL_STUDENT_PACK_BUILD: '1'
        run: node scripts/verify-student-pack.mjs
      - name: Install Chromium for 12-layout visual QA
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Draft leak negative regression suite
        id: drafts
        run: node scripts/test-draft-leakage-regressions.mjs
      - name: Fault-injection navigation regression suite
        id: navigation
        run: node scripts/test-student-navigation-regressions.mjs
      - name: Fault-inject skip links, low contrast and stalled Reveal into editorial audit
        id: editorial
        run: node scripts/test-editorial-audit-faults.mjs
      - name: Verify editorial inline-wrap overlap regression
        run: node scripts/test-editorial-overlap-regressions.mjs
      - name: Verify starter planner keyboard, labels and custom path in real browser
        id: planner
        run: node scripts/qa-starter-planner.mjs
      - name: Verify first-time onboarding guide at four widths
        id: guide
        run: node scripts/qa-preparation-guide.mjs
      - name: Upload guide screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preparation-guide-visual-qa
          path: qa-artifacts/prepare/
          retention-days: 14
      - name: Download actual guide ZIP through browser and check package bytes
        id: guidezip
        run: node scripts/qa-guide-zip-download.mjs
      - name: Audit Blocks and Effects gallery at four widths
        id: blockeffects
        run: node scripts/qa-blocks-effects.mjs
      - name: Capture 12 layouts at four widths
        id: layouts
        run: node scripts/qa-layout-screenshots.mjs
      - name: Upload 48 screenshots and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-visual-qa
          path: qa-artifacts/layouts/
          retention-days: 14
      - name: Check complete static output and deploy configuration
        run: |
          test -s dist/index.html
          test -s dist/rss.xml
          test -s dist/sitemap.xml
          test -s dist/robots.txt
          test -s dist/pagefind/pagefind.js
          test ! -e dist/_worker.js
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const c=JSON.parse(readFileSync('wrangler.jsonc','utf8')); if(c.assets?.directory!=='./dist'||'main' in c) process.exit(1);"
          grep -q 'https://example.com/sitemap.xml' dist/robots.txt
          grep -q 'https://example.com/knowledge/paper/articles/homepage-is-a-lobby/' dist/rss.xml
          grep -q 'https://example.com/knowledge/paper/articles/homepage-is-a-lobby/' dist/sitemap.xml
          if grep -q 'pikaone1138.github.io/astro-personal-site-starter/' dist/rss.xml dist/sitemap.xml; then exit 1; fi

      - name: Independently verify Cloudflare Preview HTTP and student ZIP at PR head
        id: externalpreview
        if: always()
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/qa-cloudflare-preview.mjs
      - name: Finalize five-gate quality dashboard
        if: always()
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QA_REGISTRY: ${{ steps.registry.outcome }}
          QA_COMPILE: ${{ steps.compile.outcome }}
          QA_COVERAGE: ${{ steps.coverage.outcome }}
          QA_HISTORY: ${{ steps.history.outcome }}
          QA_BUILD: ${{ steps.buildsite.outcome }}
          QA_STARTER: ${{ steps.studentkit.outcome }}
          QA_DRAFTS: ${{ steps.drafts.outcome }}
          QA_NAV: ${{ steps.navigation.outcome }}
          QA_PLANNER: ${{ steps.planner.outcome }}
          QA_EDITORIAL: ${{ steps.editorial.outcome }}
          QA_LAYOUTS: ${{ steps.layouts.outcome }}
          QA_BLOCK_EFFECT: ${{ steps.blockeffects.outcome }}
          QA_GUIDE: ${{ steps.guide.outcome }}
          QA_GUIDE_ZIP: ${{ steps.guidezip.outcome }}
          QA_DEPLOYMENT: ${{ steps.externalpreview.outcome }}
        run: node scripts/finalize-quality-dashboard.mjs
      - name: Upload final five-gate quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-five-gates
          path: qa-artifacts/quality/
          retention-days: 30
