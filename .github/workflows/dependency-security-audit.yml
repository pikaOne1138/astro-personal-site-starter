name: Dependency security audit
on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'npm-shrinkwrap.json'
      - '.github/workflows/dependency-security-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate audit-only lockfile when absent
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
      - name: Install and build for Astro compatibility
        run: |
          npm install --no-audit --no-fund
          npm run test:student-safety
          npm run build
      - name: Audit dependencies (nonblocking until triage)
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); console.log(JSON.stringify(a.metadata?.vulnerabilities || {}, null, 2));"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: warn
