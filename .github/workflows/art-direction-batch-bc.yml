name: Art Direction Batch B C Full-site Review
on:
  pull_request:
    paths:
      - 'src/pages/layouts/**'
      - 'docs/art-direction/layout-handoff-registry.json'
      - 'scripts/qa-art-direction-batch-bc.mjs'
      - '.github/workflows/art-direction-batch-bc.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Local Astro preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4321 >/tmp/astro-preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/astro-preview.log
          exit 1
      - run: node scripts/qa-art-direction-batch-bc.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art-direction-batch-bc-screenshots
          path: qa-artifacts/art-direction/batch-bc/
          retention-days: 14
