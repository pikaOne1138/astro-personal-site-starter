name: Standalone Starter Export Check
on:
  pull_request:
    paths:
      - 'scripts/export-starter.mjs'
      - 'scripts/export-art-direction-starter.mjs'
      - 'scripts/art-direction-adapters.mjs'
      - 'scripts/native-layout-adapters.mjs'
      - 'scripts/expanded-section-patterns.mjs'
      - 'src/data/art-direction-adapters/**'
      - 'scripts/verify-starter-export.mjs'
      - 'scripts/audit-generated-links.mjs'
      - 'scripts/test-generated-link-audit.mjs'
      - 'src/data/layout-directions.json'
      - 'src/data/layout-assembly/**'
      - 'src/data/starter-config.ts'
      - 'src/pages/starter/index.astro'
      - '.github/workflows/starter-export.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  checks: read
  actions: read
  contents: read
jobs:
  ci-change-classifier:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.detect.outputs.mode || steps.external.outputs.mode }}
    steps:
      - id: external
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo 'mode=full' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: detect
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          # PR #67 predates this classifier; load its trusted main copy after merge.
          if git cat-file -e origin/main:scripts/ci-pr67-change-gate.mjs 2>/dev/null; then
            git show origin/main:scripts/ci-pr67-change-gate.mjs > /tmp/ci-pr67-change-gate.mjs
            node /tmp/ci-pr67-change-gate.mjs
          else
            node scripts/ci-pr67-change-gate.mjs
          fi
  standalone-build:
    needs: ci-change-classifier
    if: needs.ci-change-classifier.outputs.mode != 'ledger_only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify link checker catches deliberate broken links
        run: node scripts/test-generated-link-audit.mjs
      - name: Install Chromium for actual learner site visual checks
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Check generated knowledge and helper sites
        env:
          FULL_STARTER_BUILD: '1'
          STUDENT_VISUAL_CAPTURE: '1'
          STUDENT_VISUAL_OUT: student-visual
        run: node scripts/verify-starter-export.mjs
      - name: Upload assembled learner screenshot gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-visual-qa
          path: student-visual/
          if-no-files-found: warn
          retention-days: 7
