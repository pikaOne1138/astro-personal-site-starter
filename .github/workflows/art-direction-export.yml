name: Art Direction Independent Adapter Check
on:
  pull_request:
    paths:
      - 'scripts/art-direction-adapters.mjs'
      - 'scripts/expanded-section-patterns.mjs'
      - 'scripts/export-starter.mjs'
      - 'scripts/build-student-pack.mjs'
      - 'docs/student-builder-pack/art-direction/**'
      - 'scripts/export-art-direction-starter.mjs'
      - 'scripts/verify-art-direction-export.mjs'
      - 'src/data/art-direction-adapters/**'
      - 'src/data/art-direction-definitions/**'
      - 'docs/art-direction/fixtures/**'
      - '.github/workflows/art-direction-export.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build independently exported sites and reject unsafe inputs
        run: node scripts/verify-art-direction-export.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art-direction-independent-adapters
          path: qa-artifacts/art-direction/
