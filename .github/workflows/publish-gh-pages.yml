name: Publish main to gh-pages branch

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages-content
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build production
        run: npm run build
      - name: Publish without deleting PR previews
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean-exclude: pr-preview/
          force: false
          single-commit: false
      - name: Production URL
        run: echo "Production is built from main. After Settings > Pages uses gh-pages /root, visit https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_STEP_SUMMARY"
