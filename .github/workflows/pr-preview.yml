name: PR Preview Build

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# PR code can build and upload artifacts, but cannot deploy Pages or write repo content.
permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci-change-classifier:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: detect
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-pr67-change-gate.mjs
  preview-build:
    needs: ci-change-classifier
    if: needs.ci-change-classifier.outputs.mode != 'ledger_only'
    # For safety, this preview pipeline handles only branches inside this repository.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Write preview event metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
        run: |
          mkdir -p .preview-meta
          printf '{"number":%s,"action":"%s"}\n' "$PR_NUMBER" "$PR_ACTION" > .preview-meta/event.json
      - name: Upload preview event metadata
        uses: actions/upload-artifact@v4
        with:
          name: preview-event
          path: .preview-meta/event.json
          retention-days: 7
      - name: Checkout PR
        if: github.event.action != 'closed'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        if: github.event.action != 'closed'
        run: npm install --no-audit --no-fund
      - name: Validate student QA packaging
        if: github.event.action != 'closed'
        run: npm run test:student-safety
      - name: Build root-path visual audit source
        if: github.event.action != 'closed'
        env:
          CF_PAGES_URL: https://example.com
        run: npm run build
      - name: Prepare Chromium for public QA gallery
        if: github.event.action != 'closed'
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Exercise student browser QA failure fixtures
        if: github.event.action != 'closed'
        run: npm run test:student-browser
      - name: Verify portable student QA with real root/subpath builds and injected faults
        if: github.event.action != 'closed'
        run: npm run test:student-responsive-e2e
      - name: Capture QA gallery from local build
        if: github.event.action != 'closed'
        env:
          LAYOUT_QA_PUBLIC: '1'
          LAYOUT_QA_OUT: .preview-qa/layouts
        run: node scripts/qa-layout-screenshots.mjs
      - name: Build PR under its preview URL prefix
        if: github.event.action != 'closed'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ASTRO_SITE_URL: https://pikaone1138.github.io
        run: |
          ASTRO_BASE_PATH="/${{ github.event.repository.name }}/pr-preview/pr-${PR_NUMBER}" npm run build
      - name: Include public layout QA gallery in PR artifact
        if: github.event.action != 'closed'
        run: |
          mkdir -p dist/qa-layouts
          cp -R .preview-qa/layouts/. dist/qa-layouts/
          test -s dist/qa-layouts/index.html
          test -s dist/qa-layouts/results.json
      - name: Upload built site
        if: github.event.action != 'closed'
        uses: actions/upload-artifact@v4
        with:
          name: preview-site
          path: dist/
          retention-days: 7
          if-no-files-found: error
