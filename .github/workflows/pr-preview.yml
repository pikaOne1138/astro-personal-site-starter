name: PR Preview Build

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# PR code can build and upload artifacts, but cannot deploy Pages or write repo content.
permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview-build:
    # For safety, this preview pipeline handles only branches inside this repository.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Write preview event metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
        run: |
          mkdir -p .preview-meta
          printf '{"number":%s,"action":"%s"}\n' "$PR_NUMBER" "$PR_ACTION" > .preview-meta/event.json
      - name: Upload preview event metadata
        uses: actions/upload-artifact@v4
        with:
          name: preview-event
          path: .preview-meta/event.json
          retention-days: 7
      - name: Checkout PR
        if: github.event.action != 'closed'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        if: github.event.action != 'closed'
        run: npm install --no-audit --no-fund
      - name: Build PR under its preview URL prefix
        if: github.event.action != 'closed'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ASTRO_SITE_URL: https://pikaone1138.github.io
        run: |
          ASTRO_BASE_PATH="/${{ github.event.repository.name }}/pr-preview/pr-${PR_NUMBER}" npm run build
      - name: Upload built site
        if: github.event.action != 'closed'
        uses: actions/upload-artifact@v4
        with:
          name: preview-site
          path: dist/
          retention-days: 7
          if-no-files-found: error
