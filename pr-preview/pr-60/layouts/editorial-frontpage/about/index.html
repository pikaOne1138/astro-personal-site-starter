j6r>寫什麼，為何寫？</h2><p data-astro-cid-bidi4j6r>用第一人稱介紹持續關心的問題、文章的整理方法與希望留給讀者的閱讀入口。</p><h2 data-astro-cid-bidi4j6r>從哪篇開始？</h2><p data-astro-cid-bidi4j6r>如果只有一篇文章，就用一篇清楚的代表文章，不補造排行榜或多篇精選。</p><a class="read" href="/astro-personal-site-starter/pr-preview/pr-60/layouts/editorial-frontpage/articles/lead-story/" data-astro-cid-bidi4j6r>閱讀示範文章 →</a></div></section> <footer data-astro-cid-bidi4j6r><span data-astro-cid-bidi4j6r>個人刊物 · 編輯式版型示範</span><a href="/astro-personal-site-starter/pr-preview/pr-60/layouts/editorial-frontpage/" data-astro-cid-bidi4j6r>回首頁 ↑</a><span data-astro-cid-bidi4j6r>沒有虛構電子報或註冊成功</span></footer> </div> </main>  <script>(function(){const fallbackUrl = "/astro-personal-site-starter/pr-preview/pr-60/layout-media-placeholder.svg";

      (() => {
        const apply = (img) => {
          if (!/^https?:\/\//.test(img.currentSrc || img.src) || img.dataset.demoFallback) return;
          img.dataset.demoFallback = 'unavailable-original';
          img.dataset.originalSrc = img.currentSrc || img.src;
          img.src = fallbackUrl;
          img.title = '原始展示圖片暫時無法載入，使用示意圖代替';

        document.querySelectorAll('main img, body img').forEach((img) => {

          if (img.complete && img.naturalWidth === 0) apply(img);
        });
      })();
